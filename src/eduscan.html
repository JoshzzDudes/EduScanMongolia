/* tabs */

/* tables */

/* pills */
.pill.ok { background: var(--a5s); color: var(--a5i); }
.pill.warn { background: var(--a4s); color: var(--a4i); }

.feed div:nth-child(4n+1) .ic { color: var(--a1); }

/* reports */

    xMerge(ws, pctR, 1, pctR, C.name, 'lab'); ws.getCell(pctR, 1).value = 'Гүйцэтгэл, дээд онооны % / Average % of max';
    if (C.ver) { xSet(ws, avgR, C.ver, '', 'lab'); xSet(ws, pctR, C.ver, '', 'lab'); }
    if (C.wrong) { const L = xCol(C.wrong), v = stMean(recs.map(r => r.sc.wrong)); xSet(ws, avgR, C.wrong, xF(`IFERROR(AVERAGE(${L}${first}:${L}${lastRow}),"")`, xR1(v)), 'calc', { fmt: '0.0' }); xSet(ws, pctR, C.wrong, '', 'calc'); }
    const colVals = k => {
      const j = C.items.indexOf(k); if (j >= 0) return [recs.filter(r => r.items[qIdx[j]]).map(r => r.items[qIdx[j]].ok ? r.items[qIdx[j]].pts : 0), qPts(ex, qIdx[j])];
      const w = C.written.indexOf(k); if (w >= 0) return [recs.map(r => r.wr[w]).filter(v => v != null), +ex.written[w].max || 0];
      const p = C.parts.indexOf(k); if (p >= 0) return [recs.filter(r => r.ps[p].pct != null).map(r => r.ps[p].e), parts[p].max];
      return [recs.map(r => r.sc.total), maxTot];
    };
    avgCols.forEach(k => {
      const L = xCol(k), [vals, mx] = colVals(k), m = stMean(vals);
      xSet(ws, avgR, k, xF(`IFERROR(AVERAGE(${L}${first}:${L}${lastRow}),"")`, xR1(m)), 'calc', { fmt: '0.0', b: true });
      xSet(ws, pctR, k, xF(`IFERROR(AVERAGE(${L}${first}:${L}${lastRow})/${L}$5,"")`, mx && vals.length ? m / mx : ''), 'calc', { fmt: '0%' });
    });
    xSet(ws, avgR, C.pct, xF(`IFERROR(AVERAGE(${P}${first}:${P}${lastRow}),"")`, recs.length && maxTot ? stMean(recs.map(r => r.sc.total)) / maxTot : ''), 'calc', { fmt: '0%', b: true });
    xSet(ws, pctR, C.pct, '', 'calc');
    [C.grade, C.level, C.support, C.rank, C.comment].forEach(k => { xSet(ws, avgR, k, '', 'calc'); xSet(ws, pctR, k, '', 'calc'); });
    // conditional formatting
    if (scoreCols.length) {
      const a = xCol(Math.min(...scoreCols)), b = xCol(Math.max(...scoreCols)), ref = `${a}${first}:${b}${lastRow}`;
      ws.addConditionalFormatting({ ref, rules: [
        { type: 'expression', formulae: [`AND(ISNUMBER(${a}${first}),${a}${first}>=${a}$5)`], style: xDxf(XC.okF, XC.okT), priority: 1 },
        { type: 'expression', formulae: [`AND(ISNUMBER(${a}${first}),${a}${first}=0)`], style: xDxf(XC.badF, XC.badT), priority: 2 }] });
    }
    parts.forEach((p, j) => { const L = xCol(C.parts[j]); ws.addConditionalFormatting({ ref: `${L}${first}:${L}${lastRow}`, rules: [{ type: 'expression', formulae: [`AND(ISNUMBER(${L}${first}),${L}${first}/${L}$5<${G.thr[j]})`], style: xDxf(XC.badF, XC.badT, true), priority: 1 }] }); });
    ws.addConditionalFormatting(xLevelRules(`${xCol(C.level)}${first}:${xCol(C.level)}${lastRow}`));
    ws.addConditionalFormatting(xColorScale(`${xCol(Math.min(...avgCols))}${pctR}:${xCol(C.total)}${pctR}`));
    const rng = k => `${xQ(name)}!$${xCol(k)}$${first}:$${xCol(k)}$${lastRow}`;
    return { name, cid, cname, recs, first, lastRow, C, qIdx, maxTot, rng, max: k => `${xQ(name)}!$${xCol(k)}$5` };
  });
}

function xSummary(wb, ex, R, G, sheets, used) {
  const name = xSheetName('Ангийн дүн', used), st = settings();
  const ws = wb.addWorksheet(name, { views: [{ showGridLines: false }], properties: { tabColor: { argb: XC.navy } }, pageSetup: { paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  const groups = sheets.map(s => ({ label: s.cname, sh: [s], recs: s.recs }));
  if (sheets.length > 1) groups.push({ label: 'Бүгд / All', sh: sheets, recs: R.recs });
  ws.getColumn(1).width = 40; groups.forEach((g, i) => { ws.getColumn(i + 2).width = 15; });
  xSet(ws, 1, 1, 'Ангийн дүн / Class summary', 'title'); ws.getRow(1).height = 22;
  xSet(ws, 2, 1, `${ex.name} · ${ex.subject || ''} · ${ex.date || ''}`, 'sub');
  const rs = (g, key) => g.sh.map(s => s.rng(s.C[key])).join(',');
  const cif = (g, key, crit) => '(' + g.sh.map(s => `COUNTIF(${s.rng(s.C[key])},${crit})`).join('+') + ')';
  let r = 3;
  const head = t => { xSet(ws, r, 1, t, 'hdr'); groups.forEach((g, i) => xSet(ws, r, i + 2, g.label, 'hdr')); ws.getRow(r).height = 30; };
  head('Үзүүлэлт / Measure');
  const tot = g => g.recs.map(x => x.sc.total), pc = g => g.recs.map(x => x.sc.total / (g.sh[0].maxTot || 1));
  const M = [
    ['Засагдсан сурагч / Students', g => `COUNT(${rs(g, 'total')})`, g => g.recs.length, '0'],
    [`Дундаж оноо / Average total (/${fmt(sheets[0]?.maxTot || 0)})`, g => `IFERROR(ROUND(AVERAGE(${rs(g, 'total')}),1),"")`, g => xR1(stMean(tot(g))), '0.0'],
    ['Медиан / Median', g => `IFERROR(MEDIAN(${rs(g, 'total')}),"")`, g => xNum(stMedian(tot(g))), '0.0'],
    ['Стандарт хазайлт / Std. deviation', g => `IFERROR(ROUND(STDEV(${rs(g, 'total')}),1),"")`, g => xR1(stSd(tot(g))), '0.0'],
    ['Дээд оноо / Highest', g => `IF(COUNT(${rs(g, 'total')})=0,"",MAX(${rs(g, 'total')}))`, g => g.recs.length ? Math.max(...tot(g)) : '', '0.0'],
    ['Доод оноо / Lowest', g => `IF(COUNT(${rs(g, 'total')})=0,"",MIN(${rs(g, 'total')}))`, g => g.recs.length ? Math.min(...tot(g)) : '', '0.0'],
    ['Дундаж хувь / Average %', g => `IFERROR(AVERAGE(${rs(g, 'pct')}),"")`, g => xNum(stMean(pc(g))), '0%'],
    [`Амжилт / Success (≥ ${LEVELS.sec[0].toLowerCase()} босго)`, g => `IFERROR(${cif(g, 'pct', `">="&${G.sec}`)}/COUNT(${rs(g, 'pct')}),"")`, g => g.recs.length ? pc(g).filter(v => v >= st.thrSuccess / 100).length / g.recs.length : '', '0%'],
    [`Чанар / Quality (≥ ${LEVELS.ext[0].toLowerCase()} босго)`, g => `IFERROR(${cif(g, 'pct', `">="&${G.ext}`)}/COUNT(${rs(g, 'pct')}),"")`, g => g.recs.length ? pc(g).filter(v => v >= st.thrQuality / 100).length / g.recs.length : '', '0%'],
    ...LEVEL_ORDER.map(k => [`${LEVELS[k][0]} / ${{ ext: 'Extending', sec: 'Secure', sup: 'Not yet secure' }[k]}`, g => cif(g, 'level', xStr(LEVELS[k][0])), g => g.recs.filter(x => x.lv === k).length, '0', k]),
    ...st.grades.map(([gr]) => [`${gr} үнэлгээ`, g => cif(g, 'grade', xStr(gr)), g => g.recs.filter(x => x.grade === gr).length, '0']),
  ];
  M.forEach(([label, f, v, fm, lv]) => {
    r++; xSet(ws, r, 1, label, 'lab', lv ? { fill: { ext: XC.okF, sec: XC.midF, sup: XC.badF }[lv], color: { ext: XC.okT, sec: XC.midT, sup: XC.badT }[lv] } : undefined);
    groups.forEach((g, i) => xSet(ws, r, i + 2, xF(f(g), v(g)), 'calc', { fmt: fm }));
  });
  // average % by part
  r += 2; head('Хэсгийн дундаж % / Average % by part'); const p0 = r + 1;
  R.parts.forEach((p, j) => {

      let e = 0, m = 0; g.recs.forEach(x => { if (x.ps[j].pct != null) { e += x.ps[j].e; m += p.max; } });
      xSet(ws, r, i + 2, xF(f, m ? e / m : ''), 'calc', { fmt: '0%' });
    });
  });
  if (R.parts.length) ws.addConditionalFormatting(xColorScale(`B${p0}:${xCol(groups.length + 1)}${r}`));
  // average % by question
  r += 2; head('Асуултын дундаж % / Average % by question'); const q0 = r + 1;
  const qIdx = sheets[0]?.qIdx || [];
  qIdx.forEach((i, j) => {
    r++; const part = R.parts.length > 1 ? R.parts.find(p => p.items.includes(i))?.name : '';
    xSet(ws, r, 1, `${i + 1}-р асуулт${part ? ' · ' + part : ''}`, 'lab');
    groups.forEach((g, gi) => {

      xSet(ws, r, gi + 2, xF(f, vals.length ? stMean(vals) : ''), 'calc', { fmt: '0%' });
    });
  });
  (ex.written || []).forEach((w, j) => {
    r++; xSet(ws, r, 1, `Задгай даалгавар ${j + 1}`, 'lab'); const m = +w.max || 0;
    groups.forEach((g, gi) => {
      const f = `IFERROR((${g.sh.map(s => `SUM(${s.rng(s.C.written[j])})`).join('+')})/(${g.sh.map(s => `COUNT(${s.rng(s.C.written[j])})`).join('+')})/${m || 1},"")`;
      const vals = g.recs.map(x => x.wr[j]).filter(v => v != null);
      xSet(ws, r, gi + 2, xF(f, vals.length && m ? stMean(vals) / m : ''), 'calc', { fmt: '0%' });
    });
  });
  if (r >= q0) ws.addConditionalFormatting(xColorScale(`B${q0}:${xCol(groups.length + 1)}${r}`));
  r += 2; xMerge(ws, r, 1, r, groups.length + 1, 'note'); ws.getCell(r, 1).value = 'Хамгийн бага дундаж хувьтай хэсэг, асуултыг эхэлж дахин заана. / Re-teach the parts and questions with the lowest average % first.';
  ws.getRow(r).height = 32;
  // the teacher's summary paragraph for each class
  r += 2; xMerge(ws, r, 1, r, groups.length + 1, 'hdr'); ws.getCell(r, 1).value = 'Ангийн дүгнэлт / Class summary note';
  sheets.forEach(sh => {
    const RC = analyze(ex, { classId: sh.cid }); if (!RC.n) return;
    const t = classComment(RC, sh.cname); r++; xMerge(ws, r, 1, r, groups.length + 1, 'calc', { h: 'left', wrap: true }); ws.getCell(r, 1).value = t;
    ws.getRow(r).height = Math.max(2, Math.ceil(t.length / (40 + groups.length * 15))) * 15 + 4;
  });
}

    'Хамаарал (r): цэг-бисериал хамаарал, тухайн асуулт ба бусад асуултын нийлбэр онооны хамаарал. 0.20-оос дээш бол асуулт шалгалтын зорилготой нийцэж байна.',
    'Сонголтын баганад ногоон нь зөв хариулт, шар нь дээд бүлэг доод бүлгээс олон сонгосон буруу хариулт (шалгах шаардлагатай).']
    .forEach(t => { xMerge(ws, r, 1, r, nc, 'note'); ws.getCell(r, 1).value = t; ws.getRow(r).height = Math.ceil(t.length / 160) * 15 + 3; r++; });

function xMatrix(wb, ex, R, used) {

function xDistribution(wb, ex, R, G, sheets, used) {
  const name = xSheetName('Тархалт', used), st = settings();
  const ws = wb.addWorksheet(name, { views: [{ showGridLines: false }], properties: { tabColor: { argb: 'FFBF8F00' } }, pageSetup: { paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  const groups = sheets.map(s => ({ label: s.cname, sh: [s], recs: s.recs }));
  if (sheets.length > 1) groups.push({ label: 'Бүгд / All', sh: sheets, recs: R.recs });
  ws.getColumn(1).width = 30; groups.forEach((g, i) => { ws.getColumn(i + 2).width = 15; });
  xSet(ws, 1, 1, 'Тархалт / Distribution', 'title'); ws.getRow(1).height = 22;
  xSet(ws, 2, 1, ex.name, 'sub');
  let r = 3;
  const head = t => { xSet(ws, r, 1, t, 'hdr'); groups.forEach((g, i) => xSet(ws, r, i + 2, g.label, 'hdr')); ws.getRow(r).height = 30; };
  const bars = (r0, r1) => groups.forEach((g, i) => ws.addConditionalFormatting({ ref: `${xCol(i + 2)}${r0}:${xCol(i + 2)}${r1}`, rules: [{ type: 'dataBar', priority: 1, gradient: false, minLength: 0, maxLength: 100, cfvo: [{ type: 'num', value: 0 }, { type: 'max' }], color: { argb: 'FF5B9BD5' } }] }));
  head('Хувийн завсар / Score band'); let r0 = r + 1;
  for (let b = 0; b < 10; b++) {
    r++; const lo = b * 10, hi = b === 9 ? 100 : lo + 9;
    xSet(ws, r, 1, `${lo}–${hi}%`, 'lab');
    groups.forEach((g, i) => {
      const f = g.sh.map(s => b === 9 ? `COUNTIFS(${s.rng(s.C.pct)},">="&${lo / 100})` : `COUNTIFS(${s.rng(s.C.pct)},">="&${lo / 100},${s.rng(s.C.pct)},"<"&${(lo + 10) / 100})`).join('+');
      xSet(ws, r, i + 2, xF(f, g.recs.filter(x => Math.min(9, Math.floor(x.sc.pct / 10)) === b).length), 'calc', { fmt: '0' });
    });
  }
  bars(r0, r);
  r += 2; head('Түвшин / Level'); r0 = r + 1;
  LEVEL_ORDER.forEach(k => {
    r++; xSet(ws, r, 1, LEVELS[k][0], 'lab', { fill: { ext: XC.okF, sec: XC.midF, sup: XC.badF }[k], color: { ext: XC.okT, sec: XC.midT, sup: XC.badT }[k] });
    groups.forEach((g, i) => xSet(ws, r, i + 2, xF(g.sh.map(s => `COUNTIF(${s.rng(s.C.level)},${xStr(LEVELS[k][0])})`).join('+'), g.recs.filter(x => x.lv === k).length), 'calc', { fmt: '0' }));
  });
  bars(r0, r);
  r += 2; head('Үсгэн үнэлгээ / Grade'); r0 = r + 1;
  st.grades.forEach(([gr]) => {
    r++; xSet(ws, r, 1, gr, 'lab');
    groups.forEach((g, i) => xSet(ws, r, i + 2, xF(g.sh.map(s => `COUNTIF(${s.rng(s.C.grade)},${xStr(gr)})`).join('+'), g.recs.filter(x => x.grade === gr).length), 'calc', { fmt: '0' }));
  });
  bars(r0, r);
}

    written: [

      { prompt: '2 кг масстай биед 10 Н хүч үйлчилбэл хурдатгал хэд вэ? Бодолтоо бич.', max: 2, rubric: 'a = F/m = 10/2 гэж бодсон (1); хариу 5 м/с² нэгжтэй (1).' },

      answers: key.map(k => { const r = R(); return r < skill ? k : r < skill + 0.06 ? '' : LET[Math.floor(R() * 4)]; }),
      written: ex.written.map(w => ({ points: String(Math.min(w.max, Math.round(R() * skill * 2 * w.max) / 2)), transcript: '', feedback: 'Жишээ өгөгдөл', typed: '' })) };

async function demoPhoto(ex, page = 1) {
  try { await document.fonts.load('40px Caveat'); } catch {}
  const ppm = 6, sc = sheetCanvas(ex, ppm, { page }), ctx = sc.getContext('2d');
  const st = studentsOf(ex.classId).find(s => s.active !== false) || S.students[0] || { code: '0001', last: 'Туршилт', first: 'Сурагч' };
  const R = rng(now() % 100000);
  const pen = (x, y) => { ctx.beginPath(); ctx.arc((x + (R() - 0.5) * 0.4) * ppm, (y + (R() - 0.5) * 0.4) * ppm, 2 * ppm, 0, Math.PI * 2); ctx.fillStyle = 'rgba(28,32,70,0.9)'; ctx.fill(); };
  if (page === 1) {
    pad4(st.code).split('').forEach((d, c) => pen(...idPos(c, +d)));
    const dv = nVer(ex) > 1 ? ex.versions[Math.floor(R() * ex.versions.length)] : '';
    if (dv) pen(...verPos(ex.versions.indexOf(dv)));
    const dk = keyOf(ex, dv);
    Array.from({ length: ex.count }, (_, i) => dk[i]).forEach((k, i) => { const pick = R() < 0.75 && k ? k : LET[Math.floor(R() * ex.choices)]; pen(...mcPos(i, LET.indexOf(pick))); });
  }
  ctx.fillStyle = 'rgba(28,32,70,0.95)';
  ctx.font = `500 ${6 * ppm}px Caveat, cursive`; ctx.fillText(fullName(st), 32 * ppm, 34 * ppm);
  ctx.font = `500 ${4.4 * ppm}px Caveat, cursive`;
  pad4(st.code).split('').forEach((d, c) => { const x = page === 1 ? idPos(c, 0)[0] : 172 + c * 7; ctx.fillText(d, (x - 1.3) * ppm, (page === 1 ? 52.4 : 35.4) * ppm); });
  const L = wrLayout(ex);
  const demoText = [['F = m · a', 'Хүч нь масс ба хурдатгалын үржвэртэй тэнцүү.', 'Нэгж нь Ньютон.'], ['a = F / m = 10 / 2', 'a = 5 м/с²']];
  if (L && L.page === page) {
    ctx.font = `500 ${5.6 * ppm}px Caveat, cursive`;
    L.boxes.forEach((b, i) => { (demoText[i] || ['Сурагчийн бичсэн хариулт']).forEach((line, j) => { const y = b.y + b.head + 6.5 + j * 8; if (y < b.y + b.h - 1) ctx.fillText(line, 20 * ppm, y * ppm); }); });
  }
  const W = 1500, H = 2000, pc = document.createElement('canvas'); pc.width = W; pc.height = H;
  const p = pc.getContext('2d');
  p.fillStyle = '#5b6168'; p.fillRect(0, 0, W, H);
  p.translate(W / 2 + 10, H / 2); p.rotate(-0.045);
  const s = 0.9 * H / sc.height;
  p.shadowColor = 'rgba(0,0,0,0.35)'; p.shadowBlur = 30;
  p.drawImage(sc, -sc.width * s / 2, -sc.height * s / 2, sc.width * s, sc.height * s);
  p.setTransform(1, 0, 0, 1, 0, 0); p.shadowBlur = 0;
  const g = p.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(255,250,235,0.06)'); g.addColorStop(1, 'rgba(0,0,0,0.2)');
  p.fillStyle = g; p.fillRect(0, 0, W, H);
  return await toBlob(pc, 'image/jpeg', 0.9);
}

    const flagged = attemptsOf(x.id).filter(a => (a.flags || []).some(Boolean)).length;

  if ((d.written || []).some(w => !(+w.max > 0))) return 'Задгай даалгаврын дээд оноо 0-ээс их байх ёстой.';
  if (UI.examTab === 'written' && (d.written || []).some(w => !String(w.prompt || '').trim())) return 'Задгай даалгаврын агуулгыг бичнэ үү.';

    UI.confirm = { text: `${missingKeys(d)} асуултын зөв хариулт оруулаагүй байна. Тэдгээр асуултад оноо тооцохгүй. Бэлэн төлөвт шилжүүлэх үү?`, buttons: [{ label: 'Тийм, шилжүүлэх', cls: 'primary', run: () => saveDraft({ ...opts, skipReady: true }) }] };
    render(); window.scrollTo(0, 0); return;
  }
  if (scoring && n && opts.recalc == null) {
    UI.confirm = { text: `Түлхүүр эсвэл оноо өөрчлөгдлөө. Энэ шалгалтад ${n} хадгалсан үр дүн байна. Тэдгээрийг шинэ түлхүүрээр дахин тооцох уу?`, buttons: [
      { label: 'Хадгалаад дахин тооцох', cls: 'primary', run: () => saveDraft({ ...opts, recalc: true }) },

  attemptsOf(ex.id).forEach(a => {

async function parseImport(file) {
  if (!window.XLSX) { toast('Excel уншигч ачаалагдсангүй. CSV файл ашиглана уу.', true); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }).filter(r => r.some(v => String(v).trim()));
    if (!rows.length) { toast('Файл хоосон байна.', true); return; }
    const h = rows[0].map(v => String(v).toLowerCase());
    const find = re => h.findIndex(v => re.test(v));
    let iCode = find(/код|id|дугаар|№/), iLast = find(/овог/), iFirst = find(/^нэр|name|нэр$/), iGender = find(/хүйс|gender/);
    let data = rows;
    if (iCode > -1 || iLast > -1 || iFirst > -1) data = rows.slice(1);
    else if (rows[0].length >= 3) { iCode = 0; iLast = 1; iFirst = 2; iGender = rows[0].length > 3 ? 3 : -1; }
    else if (rows[0].length === 2) { iLast = 0; iFirst = 1; }
    else iFirst = 0;
    if (iFirst === iLast) iLast = -1;
    const used = new Set(S.students.map(s => s.code)), seen = new Set();
    let auto = 1;
    const out = data.map(r => {
      let code = iCode > -1 ? String(r[iCode]).replace(/\D/g, '') : '';
      if (!code) { while (used.has(pad4(auto)) || seen.has(pad4(auto))) auto++; code = pad4(auto++); }
      code = pad4(code);
      const g = iGender > -1 ? String(r[iGender]).trim() : '';
      const row = { code, last: iLast > -1 ? String(r[iLast]).trim() : '', first: iFirst > -1 ? String(r[iFirst]).trim() : '', gender: /^эм|^f/i.test(g) ? 'Эм' : /^эр|^m/i.test(g) ? 'Эр' : '' };
      row.error = !row.first ? 'Нэр хоосон' : used.has(code) ? 'Код бүртгэлтэй' : seen.has(code) ? 'Файлд давхардсан' : '';
      seen.add(code); return row;
    });
    UI.importRows = { rows: out, classId: UI.page === 'class' ? UI.classId : (UI.stuFilter.classId || '') };
    render();
  } catch { toast('Файлыг уншиж чадсангүй. .xlsx эсвэл .csv файл сонгоно уу.', true); }
}

function slipCanvas(ex, list, cm) {
  const ppm = 6, c = document.createElement('canvas'); c.width = 210 * ppm; c.height = 297 * ppm;
  const ctx = c.getContext('2d'); ctx.scale(ppm, ppm); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 210, 297);
  const F = (sz, w = 400) => `${w} ${sz}px "Golos Text", Arial, sans-serif`;
  list.forEach((r, slot) => {
    const y0 = slot * 148.5, sc = r.score, st = student(r.at.studentId);
    ctx.fillStyle = '#1e3a8a'; ctx.fillRect(12, y0 + 10, 186, 9);
    ctx.fillStyle = '#fff'; ctx.font = F(3.6, 700); ctx.fillText('EduScan Mongolia · Дүнгийн хуудас', 15, y0 + 16.2);
    ctx.textAlign = 'right'; ctx.font = F(2.8); ctx.fillText(fitText(ctx, settings().school, 70), 195, y0 + 16); ctx.textAlign = 'left';
    ctx.fillStyle = '#111'; ctx.font = F(4.2, 700); ctx.fillText(fitText(ctx, r.at.name, 120), 14, y0 + 28);
    ctx.font = F(3); ctx.fillStyle = '#444';
    ctx.fillText(`Код ${r.at.studentCode} · ${className(st?.classId || ex.classId)}${r.at.version ? ' · Хувилбар ' + r.at.version : ''} · Байр ${r.rank}/${attemptsOf(ex.id).length}`, 14, y0 + 34);
    const sk = keyOf(ex, r.at.version);
    ctx.fillText(fitText(ctx, `${ex.name} · ${ex.subject || ''} · ${ex.date}`, 120), 14, y0 + 39.5);
    ctx.textAlign = 'right'; ctx.fillStyle = '#1e3a8a'; ctx.font = F(9, 700); ctx.fillText(`${fmt(sc.pct)}%`, 196, y0 + 33);
    ctx.font = F(3.2, 600); ctx.fillStyle = '#111'; ctx.fillText(`${fmt(sc.total)} / ${fmt(sc.max)} оноо · Үнэлгээ ${letter(sc.pct)}`, 196, y0 + 39.5); ctx.textAlign = 'left';
    ctx.font = F(3); ctx.fillText(`Зөв ${sc.correct} · Буруу ${sc.wrong} · Хоосон ${sc.blank}${(ex.written || []).length ? ` · Задгай ${fmt(sc.wPts)}/${fmt(sc.wMax)}` : ''}`, 14, y0 + 47);
    const cols = 20, cw = 9.2, chh = 9;
    for (let i = 0; i < ex.count; i++) {
      const cx = 14 + (i % cols) * cw, cy = y0 + 52 + Math.floor(i / cols) * (chh + 1);
      const a = (r.at.answers || [])[i] || '', k = sk[i], ok = k && a === k;
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 0.2; ctx.strokeRect(cx, cy, cw - 0.6, chh);
      ctx.fillStyle = '#888'; ctx.font = F(2); ctx.fillText(String(i + 1), cx + 0.8, cy + 2.6);
      ctx.fillStyle = !k ? '#999' : ok ? '#157a46' : '#c12f28'; ctx.font = F(3.4, 700); ctx.textAlign = 'center';
      ctx.fillText(a === '*' ? '×' : a || '–', cx + (cw - 0.6) / 2, cy + 7.2); ctx.textAlign = 'left';
      if (k && !ok) { ctx.fillStyle = '#157a46'; ctx.font = F(2); ctx.fillText(k, cx + cw - 2.8, cy + 2.6); }
    }
    let wy = y0 + 52 + Math.ceil(ex.count / cols) * (chh + 1) + 4;
    (ex.written || []).forEach((w, i) => {
      const e = (r.at.written || [])[i] || {};
      ctx.fillStyle = '#111'; ctx.font = F(2.8, 600); ctx.fillText(`Даалгавар ${i + 1}: ${e.points === '' || e.points == null ? '—' : fmt(+e.points)} / ${fmt(+w.max)} оноо`, 14, wy);
      if (e.feedback) { ctx.font = F(2.6); ctx.fillStyle = '#444'; ctx.fillText(fitText(ctx, e.feedback, 140), 58, wy); }
      wy += 5;
    });
    const note = cm?.get(r.at.id);
    if (note) {
      ctx.font = F(2.7); const lines = wrapText(ctx, note, 150), y1 = Math.max(wy + 1, y0 + 118);
      ctx.fillStyle = '#1e3a8a'; ctx.font = F(2.7, 700); ctx.fillText('Багшийн тайлбар:', 14, y1);
      ctx.fillStyle = '#222'; ctx.font = F(2.7); lines.slice(0, 3).forEach((ln, i) => ctx.fillText(ln, 44, y1 + i * 4));
    }
    ctx.strokeStyle = '#999'; ctx.lineWidth = 0.2; ctx.beginPath(); ctx.moveTo(130, y0 + 136); ctx.lineTo(196, y0 + 136); ctx.stroke();
    ctx.fillStyle = '#666'; ctx.font = F(2.5); ctx.fillText('Багшийн гарын үсэг', 130, y0 + 139.5);
    if (slot === 0) { ctx.setLineDash([1.5, 1.5]); ctx.beginPath(); ctx.moveTo(8, 148.5); ctx.lineTo(202, 148.5); ctx.stroke(); ctx.setLineDash([]); }
  });

async function downloadSlips(ex, onlyId) {

  await fontsReady();

  if (!onlyId) list.sort((a, b) => a.at.studentCode.localeCompare(b.at.studentCode));
  const R = analyze(ex), cm = new Map(R.recs.map(x => [x.at.id, commentOf(x, R)]));
  const pages = []; for (let i = 0; i < list.length; i += 2) pages.push(slipCanvas(ex, list.slice(i, i + 2), cm));
  toast('PDF бэлтгэж байна…'); await new Promise(r => setTimeout(r, 20));
  await offerFile(`${safeName(ex.name)} - ${onlyId ? safeName(list[0]?.at.name) : 'дүнгийн хуудас'}.pdf`, pdfFromCanvases(pages));
}

  if (t.id === 'classQ') { UI.classQ = t.value; const pos = t.selectionStart; render(); const n = $('#classQ'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'rpQ') { UI.reportQ = t.value; const pos = t.selectionStart; render(); const n = $('#rpQ'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (UI.draft && t.dataset.d && !['count', 'choices', 'classId', 'status', 'nver', 'writtenOn'].includes(t.dataset.d)) { UI.draft.data[t.dataset.d] = t.value; markDirty(); return; }
  if (t.dataset.cm) { const n = $(`[data-cmn="${t.dataset.cm}"]`); if (n) n.textContent = `${t.value.length}/${NOTE_MAX} · засварлаж байна`; return; }
  if (UI.draft && t.dataset.tp) {
    const d = UI.draft.data, tp = (d.topics || [])[+t.dataset.i]; if (!tp) return;
    tp[t.dataset.tp] = t.value; markDirty();
    const cn = topicCounts(d); (d.topics || []).forEach((x, i) => { const el = $(`[data-tpc="${i}"]`); if (el) el.textContent = cn[i] + ' асуулт'; });
    const fr = $('[data-tpc="free"]'); if (fr) fr.textContent = topicFreeText(d, cn[cn.length - 1]);
    return;
  }
  if (UI.draft && t.dataset.qp != null) { UI.draft.data.points = UI.draft.data.points || []; UI.draft.data.points[+t.dataset.qp] = t.value === '' ? null : +t.value; markDirty(); return; }
  if (UI.draft && t.dataset.w) {
    const w = UI.draft.data.written[+t.dataset.i], f = t.dataset.w, v = t.dataset.v;
    if (v) { w.v = w.v || {}; w.v[v] = w.v[v] || {}; w.v[v][f] = t.value; }
    else w[f] = f === 'max' ? (parseFloat(t.value) || 0) : t.value;
    markDirty(); return;
  }
  if (E && t.dataset.wp != null) { E.written[+t.dataset.wp].points = t.value; $('#edScore').innerHTML = scoreHtml(calc(exam(E.examId), { answers: E.answers, written: E.written, version: E.version }), exam(E.examId)); return; }
  if (E && t.dataset.wt != null) { E.written[+t.dataset.wt].typed = t.value; return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && LV.on) { closeLive(); return; }
  if (ev.key === 'Escape') { UI.sideOpen = false; UI.notifOpen = false; $('#gdrop').hidden = true; renderSide(); renderTop(); }
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'bulkKey') A.bulkKey();
  if (ev.target.id === 'nxName') A.createExam();
});
['dragover', 'dragleave', 'drop'].forEach(type => document.addEventListener(type, ev => {
  const dz = ev.target.closest?.('#drop'); if (!dz) return;
  ev.preventDefault(); dz.classList.toggle('drag', type === 'dragover');
  if (type === 'drop') { const f = [...(ev.dataTransfer?.files || [])].find(f => f.type.startsWith('image/')); if (f) handleScanFile(f); }
}));
window.addEventListener('beforeunload', ev => { if (UI.draft?.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
function icons() { try { window.lucide?.createIcons({ attrs: { 'stroke-width': 1.8 } }); } catch {} }

(async () => { await initStore(); render(); })();
</script>
