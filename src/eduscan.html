<script>
// =============== helpers ===============
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ic = (n, cls = '') => `<i data-lucide="${n}" class="ic ${cls}"></i>`;
const LET = 'ABCDE';

const MAX_Q = 60, MAX_WR = 4;
const LS = 'eduscan-v1';

const fmt = n => (n == null || isNaN(n)) ? '—' : Number.isInteger(+n) ? String(+n) : (+n).toFixed(1);
const clone = o => JSON.parse(JSON.stringify(o));
const now = () => Date.now();
const pad4 = v => String(v ?? '').replace(/\D/g, '').padStart(4, '0').slice(-4);
const STATUS = { draft: ['Ноорог', ''], ready: ['Бэлэн', 'acc'], done: ['Дууссан', 'ok'], archived: ['Архивласан', 'warn'] };
const ago = t => {
  const s = Math.round((now() - t) / 1000);
  if (s < 60) return 'саяхан';
  if (s < 3600) return Math.floor(s / 60) + ' мин өмнө';
  if (s < 86400) return Math.floor(s / 3600) + ' цагийн өмнө';
  if (s < 86400 * 7) return Math.floor(s / 86400) + ' өдрийн өмнө';
  return new Date(t).toLocaleDateString('sv');
};

// =============== state ===============
const DEF_SETTINGS = { id: 'main', school: '', teacher: '', thrSuccess: 60, thrQuality: 70, grades: [['A', 90], ['B', 80], ['C', 70], ['D', 60], ['F', 0]], defPoints: 1, defChoices: 4 };
const S = { classes: [], students: [], exams: [], attempts: [], settings: [clone(DEF_SETTINGS)] };

  page: 'dashboard', examId: null, classId: null, studentId: null, examTab: 'info',
  confirm: null, draft: null, filters: { q: '', classId: '', subject: '', status: '', from: '', to: '' },
  stuFilter: { q: '', classId: '', active: 'active' }, sel: new Set(), sideOpen: false, notifOpen: false,
  sheet: { examId: '', classId: '', mode: 'blank' }, gradeExamId: '', reportExamId: '', reportSort: { k: 'rank', d: 1 }, reportQ: '', itemSort: 'num',
  importRows: null, scanBusy: false, newExam: false, newClass: false, editStudent: null,
};
const Cap = { db: null, user: null, sample: null, downloads: null, uid: null, name: '', mode: 'memory', canImages: false, maxImages: 1 };
let base = null;
let E = null; // open grading editor
const settings = () => S.settings[0] || DEF_SETTINGS;
const exam = id => S.exams.find(x => x.id === (id ?? UI.examId));
const klass = id => S.classes.find(c => c.id === id);
const student = id => S.students.find(s => s.id === id);
const className = id => klass(id)?.name || '—';
const fullName = s => s ? [s.last, s.first].filter(Boolean).join(' ') : '';
const shortName = s => s ? [(s.last || '').slice(0, 1) && (s.last || '').slice(0, 1) + '.', s.first].filter(Boolean).join(' ') : '';
const studentsOf = classId => S.students.filter(s => s.classId === classId).sort((a, b) => a.code.localeCompare(b.code));
const attemptsOf = examId => S.attempts.filter(a => a.examId === examId);
const subjects = () => [...new Set(S.exams.map(x => x.subject).filter(Boolean))].sort();
// answer-key versions (А, Б, …): ex.key is the first version's key, ex.keys[v] the others'
const VLAB = ['А', 'Б', 'В', 'Г'];
const nVer = ex => Math.max(1, (ex.versions || []).length);
const V0 = ex => (ex.versions || [])[0] || '';
const keyOf = (ex, v) => (nVer(ex) < 2 || !v || v === V0(ex)) ? ex.key : (ex.keys?.[v] || []);
const wText = (ex, i, v, f) => { const w = (ex.written || [])[i] || {}; return (nVer(ex) > 1 && v && v !== V0(ex) && w.v?.[v]?.[f]) || w[f] || ''; };
const missingKeys = ex => (nVer(ex) > 1 ? ex.versions : ['']).reduce((n, v) => n + Array.from({ length: ex.count }, (_, i) => keyOf(ex, v)[i]).filter(k => !k).length, 0);
const verPill = v => v ? `<span class="pill acc">${esc(v)}</span>` : '';

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false; t.className = bad ? 'bad' : '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
}

// =============== storage ===============
async function useCap(name) {
  try { return window.claude?.use ? await window.claude.use(name) : null; } catch { return null; }
}

  }

Tasks with rubric (JSON): ${JSON.stringify(tasks)}
For every task: copy the student's answer exactly ("transcript"), check each rubric step, award points from 0 to maxPoints in steps of 0.5 strictly by the rubric ("points"), and write 1-3 sentences of feedback in Mongolian: what is correct, what is missing, one improvement tip ("feedback"). Empty or unreadable answer: 0 points and say so.

async function aiReadSheet() {

    overlay: null, crop: null, cropUrl: null, photo: null, extra: [], aiState: '', aiMsg: '', scanMsg: '', saving: false,

}
function matchStudent(ex) {

  const s = S.students.find(x => x.code === E.code && (x.classId === ex.classId || !ex.classId)) || S.students.find(x => x.code === E.code);

async function commitEditor(next, force) {

  if (nVer(ex) > 1 && !ex.versions.includes(E.version)) { toast('Хувилбараа (А, Б…) сонгоно уу.', true); return; }

function liveSupported() {

async function startStream() {
  stopStream();

  const dev = LV.devices[LV.devIdx];
  const video = dev ? { deviceId: { exact: dev.deviceId }, ...size } : { facingMode: { ideal: 'environment' }, ...size };
  LV.stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  LV.track = LV.stream.getVideoTracks()[0];
  const v = $('#lvVideo'); v.muted = true; v.setAttribute('playsinline', ''); v.srcObject = LV.stream;
  try { await v.play(); } catch {}

    const cur = LV.track.getSettings?.().deviceId; LV.devIdx = LV.devices.findIndex(d => d.deviceId === cur);
  } catch {}

async function liveError(e, ms = 999) {

  else if (n === 'NotAllowedError' || n === 'SecurityError') kind = /system/i.test(m) ? 'os' : perm === 'denied' ? 'denied' : ms < 400 ? 'blocked' : 'dismissed';
  LV.error = { kind, env, diag: `${n} · ${m || '—'} · зөвшөөрөл: ${perm} · ${Math.round(ms)} мс · ${env.inApp ? 'апп' : 'хөтөч'}` };
  // remember it, so the grading page leads with the camera-app route next time

  renderLiveUi();

  const pen = (x, y) => { ctx.beginPath(); ctx.arc((x + (R() - 0.5) * 0.4) * ppm, (y + (R() - 0.5) * 0.4) * ppm, 2 * ppm, 0, Math.PI * 2); ctx.fillStyle = 'rgba(28,32,70,0.9)'; ctx.fill(); };
  if (page === 1) {
    pad4(st.code).split('').forEach((d, c) => pen(...idPos(c, +d)));
    const dv = nVer(ex) > 1 ? ex.versions[Math.floor(R() * ex.versions.length)] : '';
    if (dv) pen(...verPos(ex.versions.indexOf(dv)));
    const dk = keyOf(ex, dv);
    Array.from({ length: ex.count }, (_, i) => dk[i]).forEach((k, i) => { const pick = R() < 0.75 && k ? k : LET[Math.floor(R() * ex.choices)]; pen(...mcPos(i, LET.indexOf(pick))); });
  }
  ctx.fillStyle = 'rgba(28,32,70,0.95)';
  ctx.font = `500 ${6 * ppm}px Caveat, cursive`; ctx.fillText(fullName(st), 32 * ppm, 34 * ppm);
  ctx.font = `500 ${4.4 * ppm}px Caveat, cursive`;
  pad4(st.code).split('').forEach((d, c) => { const x = page === 1 ? idPos(c, 0)[0] : 172 + c * 7; ctx.fillText(d, (x - 1.3) * ppm, (page === 1 ? 52.4 : 35.4) * ppm); });
  const L = wrLayout(ex);
  const demoText = [['F = m · a', 'Хүч нь масс ба хурдатгалын үржвэртэй тэнцүү.', 'Нэгж нь Ньютон.'], ['a = F / m = 10 / 2', 'a = 5 м/с²']];
  if (L && L.page === page) {
    ctx.font = `500 ${5.6 * ppm}px Caveat, cursive`;
    L.boxes.forEach((b, i) => { (demoText[i] || ['Сурагчийн бичсэн хариулт']).forEach((line, j) => { const y = b.y + b.head + 6.5 + j * 8; if (y < b.y + b.h - 1) ctx.fillText(line, 20 * ppm, y * ppm); }); });
  }
  const W = 1500, H = 2000, pc = document.createElement('canvas'); pc.width = W; pc.height = H;
  const p = pc.getContext('2d');
  p.fillStyle = '#5b6168'; p.fillRect(0, 0, W, H);
  p.translate(W / 2 + 10, H / 2); p.rotate(-0.045);
  const s = 0.9 * H / sc.height;
  p.shadowColor = 'rgba(0,0,0,0.35)'; p.shadowBlur = 30;
  p.drawImage(sc, -sc.width * s / 2, -sc.height * s / 2, sc.width * s, sc.height * s);
  p.setTransform(1, 0, 0, 1, 0, 0); p.shadowBlur = 0;
  const g = p.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(255,250,235,0.06)'); g.addColorStop(1, 'rgba(0,0,0,0.2)');
  p.fillStyle = g; p.fillRect(0, 0, W, H);
  return await toBlob(pc, 'image/jpeg', 0.9);
}

function notifications() {

async function parseImport(file) {
  if (!window.XLSX) { toast('Excel уншигч ачаалагдсангүй. CSV файл ашиглана уу.', true); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }).filter(r => r.some(v => String(v).trim()));
    if (!rows.length) { toast('Файл хоосон байна.', true); return; }
    const h = rows[0].map(v => String(v).toLowerCase());
    const find = re => h.findIndex(v => re.test(v));
    let iCode = find(/код|id|дугаар|№/), iLast = find(/овог/), iFirst = find(/^нэр|name|нэр$/), iGender = find(/хүйс|gender/);
    let data = rows;
    if (iCode > -1 || iLast > -1 || iFirst > -1) data = rows.slice(1);
    else if (rows[0].length >= 3) { iCode = 0; iLast = 1; iFirst = 2; iGender = rows[0].length > 3 ? 3 : -1; }
    else if (rows[0].length === 2) { iLast = 0; iFirst = 1; }
    else iFirst = 0;
    if (iFirst === iLast) iLast = -1;
    const used = new Set(S.students.map(s => s.code)), seen = new Set();
    let auto = 1;
    const out = data.map(r => {
      let code = iCode > -1 ? String(r[iCode]).replace(/\D/g, '') : '';
      if (!code) { while (used.has(pad4(auto)) || seen.has(pad4(auto))) auto++; code = pad4(auto++); }
      code = pad4(code);
      const g = iGender > -1 ? String(r[iGender]).trim() : '';
      const row = { code, last: iLast > -1 ? String(r[iLast]).trim() : '', first: iFirst > -1 ? String(r[iFirst]).trim() : '', gender: /^эм|^f/i.test(g) ? 'Эм' : /^эр|^m/i.test(g) ? 'Эр' : '' };
      row.error = !row.first ? 'Нэр хоосон' : used.has(code) ? 'Код бүртгэлтэй' : seen.has(code) ? 'Файлд давхардсан' : '';
      seen.add(code); return row;
    });
    UI.importRows = { rows: out, classId: UI.page === 'class' ? UI.classId : (UI.stuFilter.classId || '') };
    render();
  } catch { toast('Файлыг уншиж чадсангүй. .xlsx эсвэл .csv файл сонгоно уу.', true); }
}

// =============== pages: reports ===============
function rankList(ex) {
  const list = attemptsOf(ex.id).map(at => ({ at, score: at.score || calc(ex, at) })).sort((a, b) => b.score.total - a.score.total);
  list.forEach((r, i) => { r.rank = i && r.score.total === list[i - 1].score.total ? list[i - 1].rank : i + 1; });
  return list;
}
// per-question stats; v filters to one version, '' mixes versions (each sheet checked against its own key)
function itemStats(ex, v = '') {
  const multi = nVer(ex) > 1 && !v;
  const as = attemptsOf(ex.id).filter(a => !v || nVer(ex) < 2 || (a.version || V0(ex)) === v), n = as.length || 1;
  return Array.from({ length: ex.count }, (_, i) => {
    const dist = {}; let blank = 0, correct = 0;
    as.forEach(a => { const val = (a.answers || [])[i] || '', k = keyOf(ex, a.version)[i]; if (!val) blank++; else { dist[val] = (dist[val] || 0) + 1; if (k && val === k) correct++; } });
    const key = multi ? ex.versions.map(x => keyOf(ex, x)[i] || '–').join('/') : (keyOf(ex, v)[i] || '');
    const has = multi ? ex.versions.some(x => keyOf(ex, x)[i]) : !!key;
    return { n: i + 1, key, pts: qPts(ex, i), correct, dist, pc: has ? Math.round(correct / n * 100) : null, pb: Math.round(blank / n * 100), pw: has ? Math.round((as.length - correct - blank) / n * 100) : null };
  });
}
function histogram(ex) {
  const bins = Array(10).fill(0);
  attemptsOf(ex.id).forEach(a => { const p = a.score?.pct ?? 0; bins[Math.min(9, Math.floor(p / 10))]++; });
  const max = Math.max(1, ...bins), W = 560, H = 210, pl = 34, pb = 30, pt = 12, bw = (W - pl - 10) / 10;
  const ticks = [0, Math.ceil(max / 2), max];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Дүнгийн тархалт">
    ${ticks.map(t => { const y = H - pb - (t / max) * (H - pb - pt); return `<line x1="${pl}" x2="${W - 10}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`; }).join('')}
    ${bins.map((b, i) => { const h = (b / max) * (H - pb - pt), x = pl + i * bw + 4, y = H - pb - h; const col = i * 10 >= settings().thrQuality ? 'var(--ok)' : i * 10 + 10 <= settings().thrSuccess ? 'var(--bad)' : 'var(--primary)';
      return `<rect x="${x}" y="${y}" width="${bw - 8}" height="${Math.max(0, h)}" rx="3" fill="${col}"/>${b ? `<text x="${x + (bw - 8) / 2}" y="${y - 4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${b}</text>` : ''}<text x="${x + (bw - 8) / 2}" y="${H - pb + 16}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${i * 10}–${i === 9 ? 100 : i * 10 + 9}</text>`; }).join('')}
    <text x="${W - 10}" y="${H - 2}" text-anchor="end" font-size="10.5" fill="var(--muted)">хувь (%)</text></svg>`;
}
function itemChart(items) {
  const W = 560, H = 190, pl = 34, pb = 24, pt = 10, n = items.length, bw = (W - pl - 10) / n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Асуулт бүрийн зөв хариулсан хувь">
    ${[0, 50, 100].map(t => { const y = H - pb - t / 100 * (H - pb - pt); return `<line x1="${pl}" x2="${W - 10}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}%</text>`; }).join('')}
    ${items.map((it, i) => { const p = it.pc ?? 0, h = p / 100 * (H - pb - pt), x = pl + i * bw + 1; return `<rect x="${x}" y="${H - pb - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="1.5" fill="${p < 50 ? 'var(--bad)' : 'var(--primary)'}"><title>${it.n}-р асуулт: ${it.pc == null ? 'түлхүүргүй' : p + '%'}</title></rect>${n <= 30 || i % 5 === 4 ? `<text x="${x + bw / 2 - 1}" y="${H - pb + 14}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${it.n}</text>` : ''}`; }).join('')}</svg>`;
}
function pReports() {
  const exs = S.exams.filter(x => attemptsOf(x.id).length || x.status !== 'archived');
  if (!UI.reportExamId || !exam(UI.reportExamId)) UI.reportExamId = exs.slice().sort((a, b) => attemptsOf(b.id).length - attemptsOf(a.id).length || (b.date || '').localeCompare(a.date || ''))[0]?.id || '';
  const ex = exam(UI.reportExamId);
  if (!ex) return `<h1>Тайлан, статистик</h1><div class="card empty">${ic('chart-column')}<p class="muted">Тайлан гаргах шалгалт алга.</p></div>`;
  const s = examStats(ex), st = settings();
  const head = `<div class="spread"><h1>Тайлан, статистик</h1><select id="rpExam" aria-label="Шалгалт" style="max-width:100%">${examOpts(ex.id, exs)}</select></div>`;
  if (!s.n) return head + `<div class="card empty"><p class="muted">«${esc(ex.name)}» шалгалтад засагдсан хуудас алга.</p><button class="btn primary" data-act="toGrade">Шалгалт засах</button></div>`;
  let ranks = rankList(ex);
  const q = UI.reportQ.trim().toLowerCase();
  if (q) ranks = ranks.filter(r => (r.at.name + ' ' + r.at.studentCode).toLowerCase().includes(q));
  const { k, d } = UI.reportSort;
  const key = { rank: r => r.rank, name: r => r.at.name, code: r => r.at.studentCode, correct: r => -r.score.correct, total: r => -r.score.total }[k];
  ranks.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * d; });
  if (UI.repV && !(ex.versions || []).includes(UI.repV)) UI.repV = '';
  const items = itemStats(ex, UI.repV);
  const itemsSorted = UI.itemSort === 'hard' ? items.slice().sort((a, b) => (a.pc ?? 101) - (b.pc ?? 101)) : items;
  const th = (id, l, cls = '') => `<th class="sort ${cls}" data-act="sortRep" data-k="${id}">${l}${k === id ? (d > 0 ? ' ↑' : ' ↓') : ''}</th>`;

  return head + `
  <p class="muted">${esc(ex.subject || '')} · ${esc(className(ex.classId))} · ${esc(ex.date)} · ${ex.count} асуулт${(ex.written || []).length ? ` + ${ex.written.length} задгай` : ''}</p>
  ${s.stale ? `<div class="notice warn">${ic('refresh-cw')}<span>${s.stale} үр дүн хуучин түлхүүрээр тооцоологдсон. <button class="btn link" data-act="recalcExam" data-id="${ex.id}">Дахин тооцох</button></span></div>` : ''}
  <div class="stats">
    <div class="stat"><span class="eyebrow">Засагдсан</span><b>${s.n}</b></div>
    <div class="stat"><span class="eyebrow">Дундаж</span><b>${fmt(s.avg)}%</b><span class="small muted">${fmt(s.avgPts)} / ${fmt(s.maxPts)} оноо</span></div>
    <div class="stat"><span class="eyebrow">Дээд / Доод</span><b>${fmt(s.max)}% / ${fmt(s.min)}%</b></div>
    <div class="stat"><span class="eyebrow">Амжилт (≥${st.thrSuccess}%)</span><b>${s.success}%</b></div>
    <div class="stat"><span class="eyebrow">Чанар (≥${st.thrQuality}%)</span><b>${s.quality}%</b></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="spread"><h2>Дүнгийн тархалт</h2><span class="small muted">${grades.map(([g, n]) => `${g}: ${n}`).join(' · ')}</span></div>${histogram(ex)}</div>
    <div class="card"><h2>Асуулт бүрийн зөв хариулсан хувь</h2>${itemChart(items)}<p class="small muted">Улаан: 50%-иас бага зөв хариулсан асуулт.</p></div>

function slipCanvas(ex, list) {
  const ppm = 6, c = document.createElement('canvas'); c.width = 210 * ppm; c.height = 297 * ppm;
  const ctx = c.getContext('2d'); ctx.scale(ppm, ppm); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 210, 297);
  const F = (sz, w = 400) => `${w} ${sz}px "Golos Text", Arial, sans-serif`;
  list.forEach((r, slot) => {
    const y0 = slot * 148.5, sc = r.score, st = student(r.at.studentId);
    ctx.fillStyle = '#1e3a8a'; ctx.fillRect(12, y0 + 10, 186, 9);
    ctx.fillStyle = '#fff'; ctx.font = F(3.6, 700); ctx.fillText('EduScan Mongolia · Дүнгийн хуудас', 15, y0 + 16.2);
    ctx.textAlign = 'right'; ctx.font = F(2.8); ctx.fillText(fitText(ctx, settings().school, 70), 195, y0 + 16); ctx.textAlign = 'left';
    ctx.fillStyle = '#111'; ctx.font = F(4.2, 700); ctx.fillText(fitText(ctx, r.at.name, 120), 14, y0 + 28);
    ctx.font = F(3); ctx.fillStyle = '#444';
    ctx.fillText(`Код ${r.at.studentCode} · ${className(st?.classId || ex.classId)}${r.at.version ? ' · Хувилбар ' + r.at.version : ''} · Байр ${r.rank}/${attemptsOf(ex.id).length}`, 14, y0 + 34);
    const sk = keyOf(ex, r.at.version);
    ctx.fillText(fitText(ctx, `${ex.name} · ${ex.subject || ''} · ${ex.date}`, 120), 14, y0 + 39.5);
    ctx.textAlign = 'right'; ctx.fillStyle = '#1e3a8a'; ctx.font = F(9, 700); ctx.fillText(`${fmt(sc.pct)}%`, 196, y0 + 33);
    ctx.font = F(3.2, 600); ctx.fillStyle = '#111'; ctx.fillText(`${fmt(sc.total)} / ${fmt(sc.max)} оноо · Үнэлгээ ${letter(sc.pct)}`, 196, y0 + 39.5); ctx.textAlign = 'left';
    ctx.font = F(3); ctx.fillText(`Зөв ${sc.correct} · Буруу ${sc.wrong} · Хоосон ${sc.blank}${(ex.written || []).length ? ` · Задгай ${fmt(sc.wPts)}/${fmt(sc.wMax)}` : ''}`, 14, y0 + 47);
    const cols = 20, cw = 9.2, chh = 9;
    for (let i = 0; i < ex.count; i++) {
      const cx = 14 + (i % cols) * cw, cy = y0 + 52 + Math.floor(i / cols) * (chh + 1);
      const a = (r.at.answers || [])[i] || '', k = sk[i], ok = k && a === k;
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 0.2; ctx.strokeRect(cx, cy, cw - 0.6, chh);
      ctx.fillStyle = '#888'; ctx.font = F(2); ctx.fillText(String(i + 1), cx + 0.8, cy + 2.6);
      ctx.fillStyle = !k ? '#999' : ok ? '#157a46' : '#c12f28'; ctx.font = F(3.4, 700); ctx.textAlign = 'center';
      ctx.fillText(a === '*' ? '×' : a || '–', cx + (cw - 0.6) / 2, cy + 7.2); ctx.textAlign = 'left';
      if (k && !ok) { ctx.fillStyle = '#157a46'; ctx.font = F(2); ctx.fillText(k, cx + cw - 2.8, cy + 2.6); }
    }
    let wy = y0 + 52 + Math.ceil(ex.count / cols) * (chh + 1) + 4;
    (ex.written || []).forEach((w, i) => {
      const e = (r.at.written || [])[i] || {};
      ctx.fillStyle = '#111'; ctx.font = F(2.8, 600); ctx.fillText(`Даалгавар ${i + 1}: ${e.points === '' || e.points == null ? '—' : fmt(+e.points)} / ${fmt(+w.max)} оноо`, 14, wy);
      if (e.feedback) { ctx.font = F(2.6); ctx.fillStyle = '#444'; ctx.fillText(fitText(ctx, e.feedback, 140), 58, wy); }
      wy += 5;
    });
    ctx.strokeStyle = '#999'; ctx.lineWidth = 0.2; ctx.beginPath(); ctx.moveTo(130, y0 + 136); ctx.lineTo(196, y0 + 136); ctx.stroke();
    ctx.fillStyle = '#666'; ctx.font = F(2.5); ctx.fillText('Багшийн гарын үсэг', 130, y0 + 139.5);
    if (slot === 0) { ctx.setLineDash([1.5, 1.5]); ctx.beginPath(); ctx.moveTo(8, 148.5); ctx.lineTo(202, 148.5); ctx.stroke(); ctx.setLineDash([]); }
  });
  return c;
}
async function downloadSlips(ex, onlyId) {
  if (!window.jspdf?.jsPDF) { toast('PDF үүсгэгч ачаалагдсангүй.', true); return; }
  await fontsReady();
  let list = rankList(ex); if (onlyId) list = list.filter(r => r.at.id === onlyId);
  if (!onlyId) list.sort((a, b) => a.at.studentCode.localeCompare(b.at.studentCode));
  const pages = []; for (let i = 0; i < list.length; i += 2) pages.push(slipCanvas(ex, list.slice(i, i + 2)));
  toast('PDF бэлтгэж байна…'); await new Promise(r => setTimeout(r, 20));
  await offerFile(`${safeName(ex.name)} - ${onlyId ? safeName(list[0]?.at.name) : 'дүнгийн хуудас'}.pdf`, pdfFromCanvases(pages));
}

    const name = $('#cName').value.trim(); if (!name) { toast('Ангийн нэрээ оруулна уу.', true); return; }
    if (S.classes.some(c => c.name.toLowerCase() === name.toLowerCase() && c.id !== el.dataset.id)) { toast('Ийм нэртэй анги бүртгэлтэй байна.', true); return; }
    const c = el.dataset.id ? clone(klass(el.dataset.id)) : { id: newId() };
    Object.assign(c, { name, year: $('#cYear').value.trim(), teacher: $('#cTeacher').value.trim(), note: $('#cNote').value.trim() });
    put('classes', c); UI.newClass = false; UI.editClass = false; toast('Хадгаллаа');
    if (!el.dataset.id) { UI.classId = c.id; go('class'); } else render();
  },
  openClass: el => { UI.classId = el.dataset.id; UI.editClass = false; UI.classQ = ''; go('class'); },
  editClass: () => { UI.editClass = true; render(); },
  cancelClassEdit: () => { UI.editClass = false; render(); },
  deleteClass: () => {
    const c = klass(UI.classId), n = studentsOf(c.id).length;
    if (n) { toast(`Ангид ${n} сурагч байна. Эхлээд сурагчдыг өөр ангид шилжүүлэх эсвэл устгана уу.`, true); return; }
    UI.confirm = { danger: true, text: `«${c.name}» ангийг устгах уу?`, buttons: [{ label: 'Устгах', cls: 'solid-danger', run: () => { del('classes', c.id); go('classes', true); } }] }; render();
  },
  addStudentHere: () => { UI.editStudent = { classId: UI.page === 'class' ? UI.classId : UI.stuFilter.classId || S.classes[0]?.id || '' }; render(); $('#sFirst')?.focus(); },
  editStudent: el => { UI.editStudent = clone(student(el.dataset.id)); render(); window.scrollTo(0, 0); },
  cancelStudent: () => { UI.editStudent = null; render(); },
  saveStudent: el => {
    const code = $('#sCode').value.replace(/\D/g, ''), first = $('#sFirst').value.trim(), classId = $('#sClass').value;
    if (code.length !== 4) { toast('Сурагчийн код 4 оронтой тоо байх ёстой.', true); return; }
    if (!first) { toast('Сурагчийн нэрийг оруулна уу.', true); return; }
    if (!classId) { toast('Ангиа сонгоно уу.', true); return; }
    const dup = S.students.find(s => s.code === code && s.id !== el.dataset.id);
    if (dup) { toast(`${code} код ${fullName(dup)} (${className(dup.classId)})-д бүртгэлтэй байна.`, true); return; }
    const s = el.dataset.id ? clone(student(el.dataset.id)) : { id: newId() };
    Object.assign(s, { code, first, last: $('#sLast').value.trim(), classId, gender: $('#sGender').value, active: $('#sActive').value === '1' });
    put('students', s);
    S.attempts.filter(a => a.studentId === s.id && (a.studentCode !== s.code || a.name !== fullName(s))).forEach(a => { const c = clone(a); c.studentCode = s.code; c.name = fullName(s); put('attempts', c); });
    toast('Хадгаллаа'); UI.editStudent = el.dataset.id ? null : { classId }; render(); if (!el.dataset.id) $('#sFirst')?.focus();
  },
  deleteStudent: el => {
    const s = student(el.dataset.id);
    UI.confirm = { danger: true, text: `${fullName(s)}-г бүр устгах уу?`, buttons: [{ label: 'Устгах', cls: 'solid-danger', run: () => { del('students', s.id); UI.editStudent = null; if (UI.page === 'student') go('students', true); } }] }; render(); window.scrollTo(0, 0);
  },
  openStudent: el => { UI.studentId = el.dataset.id; go('student'); },
  importStudents: () => { if (!S.classes.length) { toast('Эхлээд анги үүсгэнэ үү.', true); return; } $('#importFile').click(); },
  cancelImport: () => { UI.importRows = null; render(); },
  doImport: () => {
    const classId = $('#impClass').value; if (!classId) { toast('Ангиа сонгоно уу.', true); return; }
    const used = new Set(S.students.map(s => s.code)); let n = 0;
    UI.importRows.rows.filter(r => !r.error && !used.has(r.code)).forEach(r => { used.add(r.code); put('students', { id: newId(), code: r.code, last: r.last, first: r.first, gender: r.gender, classId, active: true }); n++; });
    UI.importRows = null; toast(`${n} сурагч импортлогдлоо`); render();
  },
  exportStudents: async el => {
    const list = S.students.slice().sort((a, b) => className(a.classId).localeCompare(className(b.classId)) || a.code.localeCompare(b.code));
    if (!list.length) { toast('Экспортлох сурагч алга.', true); return; }
    const rows = studentRows(list);
    if (el.dataset.fmt === 'xlsx' && window.XLSX) await offerFile('Сурагчид.xlsx', xlsxBlob([['Сурагчид', rows]]));
    else await offerFile('Сурагчид.csv', csvText(rows));
  },
  dlSheet: el => downloadSheets(el.dataset.fmt),
  openCam: () => $('#cam').click(),
  openPick: () => $('#pick').click(),
  openLive: () => openLive(),
  liveClose: () => closeLive(),
  liveAllow: () => liveStart(),
  liveShot: () => liveCapture(true),
  liveTorch: () => liveTorch(),
  liveSwitch: () => liveSwitch(),
  liveSkip: () => { const ex = exam(UI.gradeExamId); if (ex && LV.front && !LV.busy) { LV.backBlob = null; liveFinish(ex); } },
  liveFallback: () => { closeLive(); UI.lastLive = false; $('#cam').click(); },
  backCam: () => $('#camBack').click(),
  backPick: () => $('#pickBack').click(),
  demoScan: async () => {
    const ex = exam(UI.gradeExamId);
    if (!ex.key.slice(0, ex.count).some(Boolean)) { toast('Эхлээд зөв хариултын түлхүүрээ оруулна уу.', true); return; }
    UI.scanBusy = true; render();
    const blob = await demoPhoto(ex);
    await handleScanFile(new File([blob], 'demo.jpg', { type: 'image/jpeg' }));
    if (wrPage(ex) === 2 && E && E.examId === ex.id) {
      const b2 = await demoPhoto(ex, 2);
      handleBackFile(new File([b2], 'demo-2.jpg', { type: 'image/jpeg' }));
    }
  },
  manual: el => openManual(exam(UI.gradeExamId), el.dataset.id),
  edVer: el => { E.version = el.dataset.v; E.verFlag = false; refreshEditor(); },
  edLetter: el => { const i = +el.dataset.i, L = el.dataset.l; E.answers[i] = E.answers[i] === L ? '' : L; E.flags[i] = false; refreshEditor(); },
  aiGrade: () => gradeWritten(),
  aiRead: () => aiReadSheet(),
  edSave: () => commitEditor(false),
  edSaveNext: () => commitEditor(true),
  edCancel: () => { E = null; render(); },
  editAttempt: el => {
    const at = S.attempts.find(a => a.id === el.dataset.id), ex = exam(at.examId);
    UI.gradeExamId = ex.id; go('grade'); E = newEditor(ex, 'edit'); loadAttempt(ex, at); render();
  },
  delAttempt: el => {
    const at = S.attempts.find(a => a.id === el.dataset.id);
    UI.confirm = { danger: true, text: `${at.name}-ийн энэ шалгалтын дүнг устгах уу?`, buttons: [{ label: 'Устгах', cls: 'solid-danger', run: () => { del('attempts', at.id); toast('Устгалаа'); } }] }; render(); window.scrollTo(0, 0);
  },
  sortRep: el => { const k = el.dataset.k; UI.reportSort = { k, d: UI.reportSort.k === k ? -UI.reportSort.d : 1 }; render(); },
  expResults: async el => { const ex = exam(UI.reportExamId); const rows = resultRows(ex);
    if (el.dataset.fmt === 'xlsx' && window.XLSX) await offerFile(`${safeName(ex.name)} - үр дүн.xlsx`, xlsxBlob([['Үр дүн', rows], ['Асуулт', itemRows(ex)], ['Сурагчид', studentRows(studentsOf(ex.classId))]]));
    else await offerFile(`${safeName(ex.name)} - үр дүн.csv`, csvText(rows)); },
  expItems: async el => { const ex = exam(UI.reportExamId); const rows = itemRows(ex);
    if (el.dataset.fmt === 'xlsx' && window.XLSX) await offerFile(`${safeName(ex.name)} - асуулт.xlsx`, xlsxBlob([['Асуулт', rows]]));
    else await offerFile(`${safeName(ex.name)} - асуулт.csv`, csvText(rows)); },
  slips: () => downloadSlips(exam(UI.reportExamId)),
  slipOne: el => downloadSlips(exam(UI.reportExamId), el.dataset.id),
  saveSettings: () => {
    const st = clone(settings());
    const succ = +$('#stSucc').value, qual = +$('#stQual').value;
    if (!(succ >= 0 && succ <= 100 && qual >= 0 && qual <= 100)) { toast('Босго 0–100 хооронд байх ёстой.', true); return; }
    Object.assign(st, { school: $('#stSchool').value.trim(), teacher: $('#stTeacher').value.trim(), defPoints: Math.max(0.5, +$('#stPts').value || 1), defChoices: +$('#stCh').value, thrSuccess: succ, thrQuality: qual });
    $$('[data-grade]').forEach(inp => { st.grades[+inp.dataset.grade][1] = Math.min(100, Math.max(0, +inp.value || 0)); });
    st.grades.sort((a, b) => b[1] - a[1]);
    S.settings = [st]; put('settings', st); toast('Тохиргоо хадгалагдлаа'); render();
  },
  backup: () => offerFile(`EduScan нөөц ${todayStr()}.json`, JSON.stringify({ app: 'eduscan', version: 1, at: new Date().toISOString(), data: { classes: S.classes, students: S.students, exams: S.exams, attempts: S.attempts, settings: S.settings } }, null, 1)),
  restore: () => $('#backupFile').click(),
};
function markDirty() {
  if (!UI.draft) return; UI.draft.dirty = true;
  const b = $('#saveDraft'); if (b) { b.disabled = false; b.nextElementSibling.disabled = false; }
  const n = $('#dirtyNote'); if (n) { n.textContent = 'Хадгалаагүй өөрчлөлт байна'; n.style.cssText = 'color:var(--warn);font-weight:600'; n.classList.remove('muted'); }
}

// =============== events ===============
document.addEventListener('click', ev => {
  if (!ev.target.closest('.gsearch')) $('#gdrop').hidden = true;
  if (UI.notifOpen && !ev.target.closest('.notif, [data-act="toggleNotif"]')) { UI.notifOpen = false; renderTop(); }
  const g = ev.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'sel' || act === 'selAll') return;
  if (el.tagName === 'TR' && ev.target.closest('button, input, a, select')) return;
  if (el.closest('#gdrop')) { $('#gdrop').hidden = true; $('#gsearch').value = ''; }
  A[act]?.(el, ev);
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'cam' || t.id === 'pick') { const f = t.files[0]; t.value = ''; if (f) handleScanFile(f); return; }
  if (t.id === 'lvAuto') { LV.auto = t.checked; try { localStorage.setItem('eduscan-live-auto', t.checked ? '1' : '0'); } catch {} return; }
  if (t.id === 'camBack' || t.id === 'pickBack') { const f = t.files[0]; t.value = ''; if (f) handleBackFile(f); return; }
  if (t.id === 'importFile') { const f = t.files[0]; t.value = ''; if (f) parseImport(f); return; }
  if (t.id === 'backupFile') {
    const f = t.files[0]; t.value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (d.app !== 'eduscan' || !d.data) throw 0;
      UI.confirm = { danger: true, text: `Нөөцөөс ${d.data.exams?.length || 0} шалгалт, ${d.data.students?.length || 0} сурагч, ${d.data.attempts?.length || 0} үр дүн сэргээх үү? Ижил ID-тай өгөгдөл дарагдана.`, buttons: [{ label: 'Сэргээх', cls: 'primary', run: () => {
        KINDS.forEach(k => (d.data[k] || []).forEach(o => put(k, o))); toast('Нөөцөөс сэргээлээ'); } }] };
      render(); window.scrollTo(0, 0);
    } catch { toast('Энэ файл EduScan-ийн нөөц файл биш байна.', true); }
    return;
  }
  if (t.dataset.act === 'sel') { t.checked ? UI.sel.add(t.dataset.id) : UI.sel.delete(t.dataset.id); $('#examTable').innerHTML = examTable(); icons(); return; }
  if (t.dataset.act === 'selAll') { filteredExams(S.exams.filter(x => x.status !== 'archived')).forEach(x => t.checked ? UI.sel.add(x.id) : UI.sel.delete(x.id)); $('#examTable').innerHTML = examTable(); icons(); return; }
  const filterMap = { fClass: 'classId', fSubject: 'subject', fStatus: 'status', fFrom: 'from', fTo: 'to' };
  if (filterMap[t.id]) { UI.filters[filterMap[t.id]] = t.value; $('#examTable').innerHTML = examTable(); icons(); return; }
  if (t.id === 'sfClass' || t.id === 'sfActive') { UI.stuFilter[t.id === 'sfClass' ? 'classId' : 'active'] = t.value; render(); return; }
  if (t.dataset.d && UI.draft) {
    const d = UI.draft.data, f = t.dataset.d;
    if (f === 'nver') d.versions = +t.value > 1 ? VLAB.slice(0, +t.value) : [];
    else d[f] = t.value;
    markDirty();
    if (f === 'count' || f === 'choices' || f === 'nver') { normalizeKey(d); render(); }
    if (f === 'writtenOn') render();
    return;
  }
  if (t.id === 'shVer') { UI.sheet.v = t.value; render(); return; }
  if (t.id === 'rpVer') { UI.repV = t.value; render(); return; }
  if (t.id === 'shExam') { UI.sheet.examId = t.value; UI.sheet.classId = exam(t.value)?.classId || ''; render(); return; }
  if (t.id === 'shClass') { UI.sheet.classId = t.value; render(); return; }
  if (t.id === 'shMode') { UI.sheet.mode = t.value; render(); return; }
  if (t.id === 'grExam') { UI.gradeExamId = t.value; E = null; UI.photoRecent = null; UI.photoCount = 0; render(); return; }
  if (t.id === 'rpExam') { UI.reportExamId = t.value; render(); return; }
  if (t.id === 'itemSort') { UI.itemSort = t.value; render(); return; }
  if (t.id === 'edStudent' && E) { E.studentId = t.value; refreshEditor(); return; }
  if (t.id === 'extraImg' && E) {
    E.extra = [...t.files]; refreshEditor();
    if (E.extra.length && Cap.sample && Cap.canImages && exam(E.examId)?.writtenOn === 'paper') gradeWritten();
    return;
  }
  if (t.id === 'impClass' && UI.importRows) { UI.importRows.classId = t.value; return; }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'gsearch') { const d = $('#gdrop'); d.innerHTML = globalResults(t.value); d.hidden = !t.value.trim(); icons(); return; }
  if (t.id === 'fQ') { UI.filters.q = t.value; $('#examTable').innerHTML = examTable(); icons(); return; }
  if (t.id === 'sfQ') { UI.stuFilter.q = t.value; const pos = t.selectionStart; render(); const n = $('#sfQ'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'classQ') { UI.classQ = t.value; const pos = t.selectionStart; render(); const n = $('#classQ'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'rpQ') { UI.reportQ = t.value; const pos = t.selectionStart; render(); const n = $('#rpQ'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (UI.draft && t.dataset.d && !['count', 'choices', 'classId', 'status', 'nver', 'writtenOn'].includes(t.dataset.d)) { UI.draft.data[t.dataset.d] = t.value; markDirty(); return; }
  if (UI.draft && t.dataset.qp != null) { UI.draft.data.points = UI.draft.data.points || []; UI.draft.data.points[+t.dataset.qp] = t.value === '' ? null : +t.value; markDirty(); return; }
  if (UI.draft && t.dataset.w) {
    const w = UI.draft.data.written[+t.dataset.i], f = t.dataset.w, v = t.dataset.v;
    if (v) { w.v = w.v || {}; w.v[v] = w.v[v] || {}; w.v[v][f] = t.value; }
    else w[f] = f === 'max' ? (parseFloat(t.value) || 0) : t.value;
    markDirty(); return;
  }
  if (E && t.dataset.wp != null) { E.written[+t.dataset.wp].points = t.value; $('#edScore').innerHTML = scoreHtml(calc(exam(E.examId), { answers: E.answers, written: E.written, version: E.version }), exam(E.examId)); return; }
  if (E && t.dataset.wt != null) { E.written[+t.dataset.wt].typed = t.value; return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && LV.on) { closeLive(); return; }
  if (ev.key === 'Escape') { UI.sideOpen = false; UI.notifOpen = false; $('#gdrop').hidden = true; renderSide(); renderTop(); }
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'bulkKey') A.bulkKey();
  if (ev.target.id === 'nxName') A.createExam();
});
['dragover', 'dragleave', 'drop'].forEach(type => document.addEventListener(type, ev => {
  const dz = ev.target.closest?.('#drop'); if (!dz) return;
  ev.preventDefault(); dz.classList.toggle('drag', type === 'dragover');
  if (type === 'drop') { const f = [...(ev.dataTransfer?.files || [])].find(f => f.type.startsWith('image/')); if (f) handleScanFile(f); }
}));
window.addEventListener('beforeunload', ev => { if (UI.draft?.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
function icons() { try { window.lucide?.createIcons({ attrs: { 'stroke-width': 1.8 } }); } catch {} }

(async () => { await initStore(); render(); })();
</script>
